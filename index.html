<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOSKY. J Music Player</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #121212;
            font-family: Arial, sans-serif;
            color: white;
        }

        .player {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 20px;
            width: 300px;
            text-align: center;
        }

        .cover {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .buttons {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            background: #1db954;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #18a349;
        }

        input[type="range"] {
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="player">
        <img src="https://picsum.photos/300" class="cover" alt="Cover">

        <h2>Lonely Nights</h2>
        <p>FOSKY. J</p>

        <audio id="audio" src="what-else.mp3"></audio>

        <input type="range" value="30">

        <div class="buttons">
            <button>Prev</button>
            <button id="play">Play</button>
            <button>Next</button>
        </div>
    </div>

    <script>
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('play');

        playBtn.addEventListener('click', function () {
            if (audio.paused) {
                audio.play();
                playBtn.textContent = 'Pause';
            } else {
                audio.pause();
                playBtn.textContent = 'Play';
            }
        });
    </script>

</body>
</html>
